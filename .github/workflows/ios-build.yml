name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The repo already contains a clean ios/HongguoTV native project.
      # Generate a fresh Pods setup so the Xcode project is consistent with
      # the checked-in Podfile (pod install is idempotent).

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/HongguoTV.xcworkspace \
            -scheme HongguoTV \
            -configuration Release \
            -destination 'generic platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios \
            build 2>&1 | tail -20

      - name: Package as unsigned ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/HongguoTV.app build/ipa/Payload/
          cd build/ipa && zip -qry ../../hongguoTV-unsigned.ipa Payload
          ls -lh ../../hongguoTV-unsigned.ipa

      - name: Verify ipa structure
        run: |
          unzip -l hongguoTV-unsigned.ipa > /tmp/ipa_list.txt
          for f in \
            "Payload/HongguoTV.app/HongguoTV" \
            "Payload/HongguoTV.app/Frameworks/React.framework/React" \
            "Payload/HongguoTV.app/Frameworks/App.framework/App" \
            "Payload/HongguoTV.app/Frameworks/App.framework/flutter_assets/AssetManifest.bin"; do
            if ! grep -q "$f" /tmp/ipa_list.txt; then
              echo "MISSING in ipa: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-unsigned-ipa
          path: hongguoTV-unsigned.ipa
          retention-days: 30
