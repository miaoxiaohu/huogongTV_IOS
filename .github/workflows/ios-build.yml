name: iOS Build

on:
  push:
    branches: [main]
    tags: ["ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check the app sources
        run: |
          # A parse error or a type error here costs seconds; the same
          # problem inside the xcodebuild costs eight minutes and a stack
          # trace that points at Metro instead of at the broken file.
          node scripts/check-sources.js
          npx tsc --noEmit
          # The offline verification suites: the signer, the crypto, the
          # base64 codec, the media crypto against a Kotlin transliteration,
          # the CENC parser against synthetic files, and the retry behaviour
          # of the signed player. All of them run without a network.
          node scripts/verify-all.js

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/HongguoTV.xcworkspace \
            -scheme HongguoTV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios \
            build

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(find build/ios -name "HongguoTV.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HongguoTV.app not found in build/ios"
            ls -la build/ios/Build/Products/ 2>/dev/null || echo "No Products dir"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package as unsigned ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/ipa/Payload/HongguoTV.app
          cd build/ipa && zip -qry ../../hongguoTV-unsigned.ipa Payload
          ls -lh ../../hongguoTV-unsigned.ipa

      - name: Verify ipa structure
        run: |
          unzip -l hongguoTV-unsigned.ipa > /tmp/ipa_list.txt
          # Core binary must exist
          if ! grep -q "Payload/HongguoTV.app/HongguoTV" /tmp/ipa_list.txt; then
            echo "FAIL: main binary HongguoTV not found in ipa"
            exit 1
          fi
          # Check ipa size (strip whitespace from wc output)
          SIZE=$(wc -c < hongguoTV-unsigned.ipa | tr -d ' ')
          echo "ipa size: $SIZE bytes"
          if [ "${SIZE:-0}" -lt 2000000 ]; then
            echo "FAIL: ipa suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "OK: ipa structure valid"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-unsigned-ipa
          path: hongguoTV-unsigned.ipa
          retention-days: 30

      # A tagged build is published as a release with a manifest next to it,
      # and the app reads that manifest to find out whether it is the newest
      # build. The manifest shape is the TV app's, so the two understand each
      # other's releases.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o 'MARKETING_VERSION = [0-9.]*' ios/HongguoTV.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')
          BUILD=$(grep -o 'CURRENT_PROJECT_VERSION = [0-9]*' ios/HongguoTV.xcodeproj/project.pbxproj | head -1 | awk '{print $3}')
          TAG="${GITHUB_REF_NAME}"
          if [ -z "${VERSION}" ] || [ -z "${BUILD}" ]; then
            echo "FAIL: the version is not in the project file"
            exit 1
          fi
          NAME="hongguotv-ios-${VERSION}.ipa"
          SHA=$(shasum -a 256 hongguoTV-unsigned.ipa | awk '{print $1}')
          SIZE=$(wc -c < hongguoTV-unsigned.ipa | tr -d ' ')
          cp hongguoTV-unsigned.ipa "${NAME}"
          cat > update.json <<JSON
          {
            "schema": 1,
            "packageName": "org.reactjs.native.example.HongguoTV",
            "versionCode": ${BUILD},
            "versionName": "${VERSION}",
            "tag": "${TAG}",
            "ipa": { "name": "${NAME}", "size": ${SIZE}, "sha256": "${SHA}" },
            "notes": "红果 TV iOS 版 ${VERSION}（build ${BUILD}）。这是未签名包，用 Sideloadly 或 AltStore 安装。"
          }
          JSON
          # The manifest is what the app reads, so it has to be there even when
          # the release itself already exists.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${NAME}" update.json --clobber
          else
            gh release create "${TAG}" "${NAME}" update.json \
              --title "红果 TV iOS ${VERSION}" \
              --notes "红果 TV iOS 版 ${VERSION}（build ${BUILD}）。未签名包，用 Sideloadly 或 AltStore 安装。"
          fi
          echo "published ${TAG}"
