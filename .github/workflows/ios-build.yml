name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          xcodebuild -workspace ios/HongguoTV.xcworkspace \
            -scheme HongguoTV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios \
            build

      - name: Locate built app
        id: locate
        run: |
          APP_PATH=$(find build/ios -name "HongguoTV.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: HongguoTV.app not found in build/ios"
            ls -la build/ios/Build/Products/ 2>/dev/null || echo "No Products dir"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package as unsigned ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/ipa/Payload/HongguoTV.app
          cd build/ipa && zip -qry ../../hongguoTV-unsigned.ipa Payload
          ls -lh ../../hongguoTV-unsigned.ipa

      - name: Verify ipa structure
        run: |
          unzip -l hongguoTV-unsigned.ipa > /tmp/ipa_list.txt
          for f in \
            "Payload/HongguoTV.app/HongguoTV" \
            "Payload/HongguoTV.app/Frameworks/React.framework/React" \
            "Payload/HongguoTV.app/Frameworks/App.framework/App"; do
            if ! grep -q "$f" /tmp/ipa_list.txt; then
              echo "MISSING in ipa: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-unsigned-ipa
          path: hongguoTV-unsigned.ipa
          retention-days: 30
